services:
  - type: web
    name: crop-yield-prediction
    env: python
    plan: free
    buildCommand: |
      cd frontend && \
      npm install && \
      VITE_API_URL= npm run build && \
      cd ../backend && \
      pip install -r requirements.txt
    startCommand: python backend/start.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: cropcast
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_ISSUER_DOMAIN
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_URL
        value: ""
